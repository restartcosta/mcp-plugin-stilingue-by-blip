<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="flex-direction:row; gap:16px; align-items:center; padding:20px 24px;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 20px; background:#fff; border:1px solid var(--color-border-3); border-radius:8px; flex:1;">
    <img src="../assets/logos/blip-logo.svg" style="width:160px; height:auto;">
    <div class="swatch__hex">color · on light</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 20px; background:#fff; border:1px solid var(--color-border-3); border-radius:8px; flex:1;">
    <img src="../assets/logos/blip-logo-black.svg" style="width:160px; height:auto;">
    <div class="swatch__hex">mono black</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 20px; background:var(--color-neutral-city); border-radius:8px; flex:1;">
    <img src="../assets/logos/blip-logo-white.svg" style="width:160px; height:auto;">
    <div style="font-size:10px; color:#fff; font-family:ui-monospace,monospace;">mono white</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 20px; background:var(--gradient-ocean); border-radius:8px; flex:1;">
    <img src="../assets/logos/blip-logo-white.svg" style="width:160px; height:auto;">
    <div style="font-size:10px; color:#fff; font-family:ui-monospace,monospace;">mono white · on gradient</div>
  </div>
</div>
</body></html>
