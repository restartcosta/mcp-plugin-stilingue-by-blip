<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="flex-direction:row; gap:24px; align-items:center;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; background:#fff; border:1px solid var(--color-border-3); border-radius:8px;">
    <img src="../assets/logos/blip-mark.png" style="height:64px; width:auto;">
    <div class="swatch__hex">on white</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; background:var(--color-brand); border-radius:8px;">
    <img src="../assets/logos/blip-mark.png" style="height:64px; width:auto; filter:brightness(0) invert(1);">
    <div style="font-size:10px; color:#fff; font-family:ui-monospace,monospace;">on brand</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; background:var(--color-neutral-city); border-radius:8px;">
    <img src="../assets/logos/blip-mark.png" style="height:64px; width:auto; filter:brightness(0) invert(1);">
    <div style="font-size:10px; color:#fff; font-family:ui-monospace,monospace;">on dark</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px; background:var(--gradient-ocean); border-radius:8px;">
    <img src="../assets/logos/blip-mark.png" style="height:64px; width:auto; filter:brightness(0) invert(1);">
    <div style="font-size:10px; color:#fff; font-family:ui-monospace,monospace;">on gradient</div>
  </div>
</div>
</body></html>
