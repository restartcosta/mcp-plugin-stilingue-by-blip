<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid-5">
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-ocean); height:72px;"></div><div class="swatch__name">ocean</div><div class="swatch__hex">blue → acai</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-rose); height:72px;"></div><div class="swatch__name">rose</div><div class="swatch__hex">red → blush</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-phoenix); height:72px;"></div><div class="swatch__name">phoenix</div><div class="swatch__hex">cheetos → watermelon</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-tree); height:72px;"></div><div class="swatch__name">tree</div><div class="swatch__hex">green → sea</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-cactus); height:72px;"></div><div class="swatch__name">cactus</div><div class="swatch__hex">lime → sea</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-smurf); height:72px;"></div><div class="swatch__name">smurf</div><div class="swatch__hex">ocean → blue</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-grape); height:72px;"></div><div class="swatch__name">grape</div><div class="swatch__hex">bell → dark</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-fabulous); height:72px;"></div><div class="swatch__name">fabulous</div><div class="swatch__hex">watermelon → witch</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-street); height:72px;"></div><div class="swatch__name">street</div><div class="swatch__hex">elephant → skate</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--gradient-universe); height:72px;"></div><div class="swatch__name">universe</div><div class="swatch__hex">city → black</div></div>
  </div>
</div>
</body></html>
