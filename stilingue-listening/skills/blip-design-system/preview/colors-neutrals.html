<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid-5">
    <div class="swatch"><div class="swatch__chip" style="background:#FFFFFF; border:1px solid var(--color-border-1)"></div><div class="swatch__name">surface-0</div><div class="swatch__hex">#FFFFFF</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#F6F6F6"></div><div class="swatch__name">surface-1</div><div class="swatch__hex">#F6F6F6</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#EDEDED"></div><div class="swatch__name">surface-2</div><div class="swatch__hex">#EDEDED</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#E3E3E3"></div><div class="swatch__name">surface-3</div><div class="swatch__hex">#E3E3E3</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#141414"></div><div class="swatch__name" style="color:#141414">surface-4</div><div class="swatch__hex">#141414</div></div>
  </div>
  <div class="grid-5">
    <div class="swatch"><div class="swatch__chip" style="background:#282828"></div><div class="swatch__name">content-default</div><div class="swatch__hex">#282828</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#595959"></div><div class="swatch__name">content-disable</div><div class="swatch__hex">#595959</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#8C8C8C"></div><div class="swatch__name">content-ghost</div><div class="swatch__hex">#8C8C8C</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#FFFFFF; border:1px solid var(--color-border-1)"></div><div class="swatch__name">content-bright</div><div class="swatch__hex">#FFFFFF</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#000000"></div><div class="swatch__name">content-din</div><div class="swatch__hex">#000000</div></div>
  </div>
</div>
</body></html>
