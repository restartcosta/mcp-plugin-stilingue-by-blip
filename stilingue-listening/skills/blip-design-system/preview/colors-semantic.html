<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid-4">
    <div class="swatch"><div class="swatch__chip" style="background:#01723E"></div><div class="swatch__name">surface-positive</div><div class="swatch__hex">#01723E</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#8A0000"></div><div class="swatch__name">surface-negative</div><div class="swatch__hex">#8A0000</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#007A42"></div><div class="swatch__name">positive</div><div class="swatch__hex">#007A42</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#A80B0B"></div><div class="swatch__name">negative</div><div class="swatch__hex">#A80B0B</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#84EBBC"></div><div class="swatch__name">success</div><div class="swatch__hex">#84EBBC</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#FDE99B"></div><div class="swatch__name">warning</div><div class="swatch__hex">#FDE99B</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#FABEBE"></div><div class="swatch__name">error</div><div class="swatch__hex">#FABEBE</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#E60F0F"></div><div class="swatch__name">delete</div><div class="swatch__hex">#E60F0F</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#80E3EB"></div><div class="swatch__name">info</div><div class="swatch__hex">#80E3EB</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#B2DFFD"></div><div class="swatch__name">system</div><div class="swatch__hex">#B2DFFD</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:#C226FB"></div><div class="swatch__name">focus</div><div class="swatch__hex">#C226FB</div></div>
    <div class="swatch"><div class="swatch__chip" style="background:rgba(0,0,0,.08); border:1px solid var(--color-border-3)"></div><div class="swatch__name">hover tint</div><div class="swatch__hex">rgba(0,0,0,.08)</div></div>
  </div>
</div>
</body></html>
