<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row" style="align-items:flex-end; gap:16px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--micro">AN</div><div class="swatch__hex">24</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--extra-small">AN</div><div class="swatch__hex">32</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--small">AN</div><div class="swatch__hex">40</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--standard">AN</div><div class="swatch__hex">56</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--large">AN</div><div class="swatch__hex">64</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div class="bds-avatar bds-avatar--extra-large">AN</div><div class="swatch__hex">72</div></div>
  </div>
  <div class="row" style="gap:16px;">
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-system);">LZ</div>
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-success);">MK</div>
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-warning);">TR</div>
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-error);">JP</div>
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-info);">CL</div>
    <div class="bds-avatar bds-avatar--standard" style="background:var(--color-surface-2); color:var(--color-content-disable);">+4</div>
  </div>
</div>
</body></html>
