<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:12px;">
    <button class="bds-btn bds-btn--solid bds-btn--danger">Delete</button>
    <button class="bds-btn bds-btn--outline bds-btn--danger">Remove</button>
    <button class="bds-btn bds-btn--text bds-btn--danger">Dismiss</button>
    <button class="bds-btn bds-btn--solid bds-btn--positive">Confirm</button>
    <button class="bds-btn bds-btn--outline bds-btn--positive">Approve</button>
  </div>
</div>
</body></html>
