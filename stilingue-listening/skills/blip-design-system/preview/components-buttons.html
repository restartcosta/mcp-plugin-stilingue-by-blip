<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:12px;">
    <button class="bds-btn bds-btn--solid">Send message</button>
    <button class="bds-btn bds-btn--outline">Cancel</button>
    <button class="bds-btn bds-btn--text">Learn more</button>
    <button class="bds-btn bds-btn--solid" disabled>Disabled</button>
  </div>
  <div class="row" style="gap:12px;">
    <button class="bds-btn bds-btn--solid bds-btn--short">Short 32</button>
    <button class="bds-btn bds-btn--solid">Standard 40</button>
    <button class="bds-btn bds-btn--solid bds-btn--large">Large 56</button>
  </div>
</div>
</body></html>
