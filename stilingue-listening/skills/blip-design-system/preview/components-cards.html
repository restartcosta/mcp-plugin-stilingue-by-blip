<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:16px;">
    <div class="bds-card bds-card--hover" style="width:260px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="bds-avatar bds-avatar--small" style="background:var(--color-system);">AN</div>
        <div>
          <div style="font-weight:700; font-size:14px;">Ana Nunes</div>
          <div style="font-size:12px; color:var(--color-content-ghost);">Customer · WhatsApp</div>
        </div>
      </div>
      <div style="margin-top:10px; font-size:13px; color:var(--color-content-default); line-height:1.4;">Hi, can I change my delivery address?</div>
      <div style="margin-top:10px; display:flex; gap:6px;">
        <span class="bds-chip bds-chip--primary">New</span>
        <span class="bds-chip bds-chip--default">Support</span>
      </div>
    </div>
    <div class="bds-card bds-card--selectable" style="width:260px;">
      <div style="font-weight:700; font-size:14px;">Sales funnel</div>
      <div style="font-size:12px; color:var(--color-content-ghost); margin-top:4px;">4 flows · 12 intents</div>
      <div style="margin-top:12px; height:48px; background:var(--gradient-ocean); border-radius:6px;"></div>
    </div>
    <div class="bds-card" style="width:120px;">
      <div style="font-size:11px; color:var(--color-content-ghost); font-weight:600; text-transform:uppercase;">Today</div>
      <div style="font-size:28px; font-weight:800; line-height:1; margin-top:4px;">1,284</div>
      <div style="font-size:12px; color:var(--color-positive); font-weight:600;">+12%</div>
    </div>
  </div>
</div>
</body></html>
