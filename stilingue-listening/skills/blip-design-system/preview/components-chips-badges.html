<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row">
    <span class="bds-chip bds-chip--primary">Primary</span>
    <span class="bds-chip bds-chip--filter">Filter · 3</span>
    <span class="bds-chip bds-chip--danger">Error</span>
    <span class="bds-chip bds-chip--watermelon">New</span>
    <span class="bds-chip bds-chip--default">Draft</span>
  </div>
  <div class="row">
    <span class="bds-chip bds-chip--tall bds-chip--primary">Tall chip</span>
    <span class="bds-chip bds-chip--tall bds-chip--filter">WhatsApp</span>
    <span class="bds-chip bds-chip--tall bds-chip--default">Instagram</span>
  </div>
  <div class="row">
    <span class="bds-badge">3</span>
    <span class="bds-badge" style="background:var(--color-primary);">12</span>
    <span class="bds-badge" style="background:var(--color-positive);">online</span>
  </div>
</div>
</body></html>
