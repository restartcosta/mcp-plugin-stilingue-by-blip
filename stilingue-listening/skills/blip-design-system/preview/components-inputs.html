<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card" style="gap:14px;">
  <div class="bds-input" style="max-width:280px;">
    <div class="bds-input__label">Email</div>
    <div class="bds-input__box"><input placeholder="you@company.com" value="ana@blip.ai"></div>
  </div>
  <div class="bds-input bds-input--danger" style="max-width:280px;">
    <div class="bds-input__label">Password</div>
    <div class="bds-input__box"><input type="password" value="short"></div>
    <div class="bds-input__msg">Minimum 8 characters</div>
  </div>
  <div class="bds-input bds-input--success" style="max-width:280px;">
    <div class="bds-input__label">Bot name</div>
    <div class="bds-input__box"><input value="Concierge"></div>
    <div class="bds-input__msg">Available</div>
  </div>
</div>
</body></html>
