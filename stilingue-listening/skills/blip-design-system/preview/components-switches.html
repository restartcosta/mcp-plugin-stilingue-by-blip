<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="../bds-components.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:32px;">
    <label style="display:flex; align-items:center; gap:10px;">
      <span class="bds-switch"><input type="checkbox" checked><span class="bds-switch__track"></span><span class="bds-switch__thumb"></span></span>
      <span style="font-size:14px;">Enable WhatsApp channel</span>
    </label>
    <label style="display:flex; align-items:center; gap:10px;">
      <span class="bds-switch"><input type="checkbox"><span class="bds-switch__track"></span><span class="bds-switch__thumb"></span></span>
      <span style="font-size:14px;">Route to human agent</span>
    </label>
  </div>
  <div class="row" style="gap:24px; padding-top:4px;">
    <label style="display:inline-flex; align-items:center; gap:8px; font-size:14px;">
      <input type="checkbox" checked style="accent-color:var(--color-primary); width:16px; height:16px;"> Marketing opt-in
    </label>
    <label style="display:inline-flex; align-items:center; gap:8px; font-size:14px;">
      <input type="radio" name="r" checked style="accent-color:var(--color-primary); width:16px; height:16px;"> Public bot
    </label>
    <label style="display:inline-flex; align-items:center; gap:8px; font-size:14px;">
      <input type="radio" name="r" style="accent-color:var(--color-primary); width:16px; height:16px;"> Private bot
    </label>
  </div>
</div>
</body></html>
