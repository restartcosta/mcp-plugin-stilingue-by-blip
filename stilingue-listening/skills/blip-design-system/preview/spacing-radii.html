<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="gap:24px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:0;"></div><div class="swatch__name">none</div><div class="swatch__hex">0</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:4px;"></div><div class="swatch__name">xs</div><div class="swatch__hex">4 · focus</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:8px;"></div><div class="swatch__name">sm · default</div><div class="swatch__hex">8 · inputs, cards, btn</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:10px;"></div><div class="swatch__name">md</div><div class="swatch__hex">10 · btn-group</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:16px;"></div><div class="swatch__name">lg</div><div class="swatch__hex">16</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--color-surface-1); border:1px solid var(--color-border-2); border-radius:999px;"></div><div class="swatch__name">pill</div><div class="swatch__hex">avatar, chip</div></div>
  </div>
</div>
</body></html>
