<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns: 70px 1fr; row-gap:10px; column-gap:20px; align-items:center;">
    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-1</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:4px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">4 px · gap</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-2</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:8px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">8 px · small gap</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-3</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:12px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">12 px · input inset</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-4</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:16px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">16 px · button inset, card pad</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-6</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:24px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">24 px · section pad</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-7</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:32px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">32 px</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-8</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:40px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">40 px</span></div>

    <div style="font-size:10px; color:var(--color-content-ghost); font-family:ui-monospace,monospace;">space-10</div>
    <div style="display:flex; align-items:center; gap:12px;"><div style="width:64px; height:20px; background:var(--color-primary);"></div><span style="font-size:11px; color:var(--color-content-ghost);">64 px · layout gutter</span></div>
  </div>
</div>
</body></html>
