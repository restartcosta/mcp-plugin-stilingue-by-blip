<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; gap:24px; align-items:baseline;">
    <div style="font-family:var(--bds-font-family); font-size:72px; font-weight:800; line-height:1;">Aa</div>
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="font-size:18px; font-weight:700;">Nunito Sans</div>
      <div style="font-size:12px; color:var(--color-content-ghost);">Humanist sans. Variable weight 100–900, roman + italic.</div>
      <div style="font-size:11px; color:var(--color-content-disable); font-family:ui-monospace,monospace;">'Nunito Sans', 'Carbona', 'Tahoma', 'Helvetica', 'Arial', sans-serif</div>
    </div>
  </div>
  <div style="display:flex; gap:18px; padding-top:8px; border-top:1px solid var(--color-border-3);">
    <div style="font-weight:400;">Regular 400</div>
    <div style="font-weight:600;">SemiBold 600</div>
    <div style="font-weight:700;">Bold 700</div>
    <div style="font-weight:800;">ExtraBold 800</div>
    <div style="font-weight:600; font-style:italic;">Italic</div>
  </div>
</div>
</body></html>
